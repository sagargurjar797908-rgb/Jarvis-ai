<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #02060a;
      color: #00eaff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .jarvis {
      width: 92%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      letter-spacing: 8px;
      text-shadow: 0 0 10px #00eaff, 0 0 30px #00eaff;
      margin-bottom: 10px;
    }

    .status {
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 35px;
    }

    .core {
      width: 210px;
      height: 210px;
      margin: auto;
      border: 3px solid #00eaff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow:
        0 0 20px #00eaff,
        inset 0 0 30px #00eaff;
      animation: pulse 2s infinite;
    }

    .core-inner {
      width: 125px;
      height: 125px;
      border: 2px solid #00eaff;
      border-radius: 50%;
      box-shadow: 0 0 25px #00eaff;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    .message {
      margin: 35px auto 20px;
      min-height: 50px;
      font-size: 18px;
      line-height: 1.5;
    }

    button {
      border: 2px solid #00eaff;
      background: transparent;
      color: #00eaff;
      padding: 14px 35px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 15px #00eaff;
    }

    button:active {
      transform: scale(0.95);
    }

    .input-box {
      margin-top: 25px;
      display: flex;
      gap: 8px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #00eaff;
      border-radius: 20px;
      background: #061017;
      color: white;
      outline: none;
    }

    .send {
      padding: 10px 18px;
    }
  </style>
</head>

<body>

  <div class="jarvis">

    <h1>JARVIS</h1>

    <div class="status" id="status">
      SYSTEM ONLINE
    </div>

    <div class="core">
      <div class="core-inner"></div>
    </div>

    <div class="message" id="message">
      Hello Boss. I am ready.
    </div>

    <button onclick="startListening()">
      🎙️ SPEAK
    </button>

    <div class="input-box">
      <input
        type="text"
        id="textInput"
        placeholder="Type a command..."
      >

      <button class="send" onclick="sendText()">
        SEND
      </button>
    </div>

  </div>

  <script>

    const message = document.getElementById("message");
    const status = document.getElementById("status");

    function speak(text) {
      message.innerText = text;

      if ("speechSynthesis" in window) {
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = "en-IN";
        speech.rate = 1;
        speech.pitch = 1;
        speechSynthesis.cancel();
        speechSynthesis.speak(speech);
      }
    }

    function processCommand(command) {

      command = command.toLowerCase().trim();

      if (command.includes("hello") ||
          command.includes("hi")) {

        speak("Hello Boss. How can I help you?");
      }

      else if (command.includes("your name")) {

        speak("My name is JARVIS, your AI assistant.");
      }

      else if (command.includes("time")) {

        const time = new Date().toLocaleTimeString();
        speak("The current time is " + time);
      }

      else if (command.includes("open google")) {

        speak("Opening Google.");
        window.open("https://www.google.com", "_blank");
      }

      else {

        speak("I heard you say: " + command);
      }
    }

    function sendText() {

      const input = document.getElementById("textInput");
      const command = input.value;

      if (command.trim() !== "") {
        processCommand(command);
        input.value = "";
      }
    }

    function startListening() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        speak("Sorry Boss, voice recognition is not supported in this browser.");
        return;
      }

      const recognition = new SpeechRecognition();

      recognition.lang = "en-IN";
      recognition.continuous = false;
      recognition.interimResults = false;

      status.innerText = "LISTENING...";

      recognition.start();

      recognition.onresult = function(event) {

        const command =
          event.results[0][0].transcript;

        status.innerText = "PROCESSING...";

        processCommand(command);

        setTimeout(() => {
          status.innerText = "SYSTEM ONLINE";
        }, 1000);
      };

      recognition.onerror = function() {

        status.innerText = "SYSTEM ONLINE";

        speak("Sorry Boss, I could not understand that.");
      };
    }

  </script>

</body>
      </html>
