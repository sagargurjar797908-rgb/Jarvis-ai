<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JARVIS AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(circle at center,
        #123,
        #020617 45%,
        #000 100%);

      color: #00eaff;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .container {
      width: 95%;
      max-width: 600px;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 55px;
      letter-spacing: 8px;
      margin-bottom: 10px;

      text-shadow:
        0 0 10px #00eaff,
        0 0 30px #00eaff;
    }

    #status {
      font-size: 14px;
      letter-spacing: 3px;
      margin-bottom: 35px;
    }

    .core {
      width: 190px;
      height: 190px;

      margin: auto;

      border-radius: 50%;
      border: 3px solid #00eaff;

      box-shadow:
        0 0 20px #00eaff,
        0 0 60px #00eaff,
        inset 0 0 30px #00eaff;

      display: flex;
      justify-content: center;
      align-items: center;

      animation: pulse 2s infinite;
    }

    .core::before {
      content: "";

      width: 90px;
      height: 90px;

      border-radius: 50%;
      background: #00eaff;

      box-shadow:
        0 0 20px #00eaff,
        0 0 50px #00eaff;
    }

    @keyframes pulse {

      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }

      100% {
        transform: scale(1);
      }

    }

    #message {
      min-height: 70px;

      margin-top: 35px;
      padding: 15px;

      font-size: 18px;
      color: white;
    }

    button {
      margin-top: 15px;

      padding: 15px 30px;

      border: 2px solid #00eaff;
      border-radius: 30px;

      background: transparent;
      color: #00eaff;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 0 15px #00eaff;

      transition: 0.3s;
    }

    button:hover {
      background: #00eaff;
      color: #000;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    input {
      flex: 1;

      padding: 14px;

      border-radius: 25px;
      border: 1px solid #00eaff;

      outline: none;

      background: rgba(0, 0, 0, 0.5);

      color: white;
      font-size: 16px;
    }

    input::placeholder {
      color: #aaa;
    }

    .send {
      margin-top: 0;
      padding: 12px 20px;
    }

    @media (max-width: 500px) {

      h1 {
        font-size: 40px;
      }

      .core {
        width: 150px;
        height: 150px;
      }

      .core::before {
        width: 70px;
        height: 70px;
      }

      .input-area {
        flex-direction: column;
      }

      .send {
        width: 100%;
      }
    }
  </style>
</head>


<body>

  <div class="container">

    <h1>JARVIS</h1>

    <div id="status">
      SYSTEM ONLINE
    </div>

    <div class="core"></div>

    <div id="message">
      Hello Boss. I am ready.
    </div>

    <button onclick="startListening()">
      🎙️ SPEAK
    </button>

    <div class="input-area">

      <input
        id="textInput"
        type="text"
        placeholder="Type your command..."
        onkeydown="handleEnter(event)"
      >

      <button
        class="send"
        onclick="sendText()"
      >
        SEND
      </button>

    </div>

  </div>


<script>

const BACKEND_URL =
  "https://jarvis-ai-ac93.onrender.com";

const message =
  document.getElementById("message");

const status =
  document.getElementById("status");


// ======================================
// FIND BEST VOICE
// ======================================

let voices = [];

function loadVoices() {

  voices =
    window.speechSynthesis.getVoices();

}

loadVoices();

if ("onvoiceschanged" in speechSynthesis) {

  speechSynthesis.onvoiceschanged =
    loadVoices;

}


// ======================================
// DETECT LANGUAGE
// ======================================

function detectLanguage(text) {

  // Hindi Devanagari
  if (/[\u0900-\u097F]/.test(text)) {
    return "hi-IN";
  }


  const hindiWords = [
    "hai",
    "hain",
    "hoon",
    "hun",
    "kya",
    "kaise",
    "kaisa",
    "kar",
    "karo",
    "khol",
    "kholo",
    "batao",
    "bata",
    "mujhe",
    "mera",
    "meri",
    "tum",
    "aap",
    "abhi",
    "kal",
    "aaj",
    "kyun",
    "nahi",
    "haan",
    "achha",
    "acha"
  ];


  const words =
    text.toLowerCase().split(/\s+/);


  let hindiCount = 0;


  words.forEach(word => {

    if (hindiWords.includes(word)) {
      hindiCount++;
    }

  });


  if (hindiCount >= 1) {
    return "hi-IN";
  }


  return "en-IN";
}


// ======================================
// NATURAL TEXT TO SPEECH
// ======================================

function speak(text) {

  message.innerText = text;


  if (!("speechSynthesis" in window)) {
    return;
  }


  speechSynthesis.cancel();


  const language =
    detectLanguage(text);


  const speech =
    new SpeechSynthesisUtterance(text);


  speech.lang = language;


  // Find suitable voice
  let selectedVoice =
    voices.find(voice =>
      voice.lang
        .toLowerCase()
        .startsWith(
          language.substring(0, 2)
        )
    );


  // Prefer Google voices if available
  const googleVoice =
    voices.find(voice =>
      voice.name
        .toLowerCase()
        .includes("google") &&
      voice.lang
        .toLowerCase()
        .startsWith(
          language.substring(0, 2)
        )
    );


  if (googleVoice) {
    selectedVoice = googleVoice;
  }


  if (selectedVoice) {
    speech.voice = selectedVoice;
  }


  speech.rate = 0.95;
  speech.pitch = 1;
  speech.volume = 1;


  speechSynthesis.speak(speech);
}


// ======================================
// LOCAL COMMANDS
// ======================================

function handleCommand(command) {

  const text =
    command.toLowerCase().trim();


  // GOOGLE
  if (
    text.includes("google kholo") ||
    text.includes("google khol") ||
    text.includes("open google")
  ) {

    speak(
      "Google khol raha hoon Boss."
    );

    window.open(
      "https://www.google.com",
      "_blank"
    );

    return true;
  }


  // YOUTUBE OPEN
  if (
    text === "youtube" ||
    text === "youtube kholo" ||
    text === "youtube khol" ||
    text === "open youtube"
  ) {

    speak(
      "YouTube khol raha hoon Boss."
    );

    window.open(
      "https://www.youtube.com",
      "_blank"
    );

    return true;
  }


  // YOUTUBE SEARCH
  const patterns = [
    "youtube par search karo",
    "youtube pe search karo",
    "youtube par search",
    "youtube pe search",
    "youtube search karo",
    "youtube search"
  ];


  for (const pattern of patterns) {

    if (text.startsWith(pattern)) {

      const query =
        text
          .substring(pattern.length)
          .trim();


      if (!query) {

        speak(
          "Boss, YouTube par kya search karna hai?"
        );

        return true;
      }


      speak(
        `YouTube par ${query} search kar raha hoon Boss.`
      );


      const url =
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query);


      window.open(
        url,
        "_blank"
      );


      return true;
    }

  }


  // GITHUB
  if (
    text.includes("github kholo") ||
    text.includes("github khol") ||
    text.includes("open github")
  ) {

    speak(
      "GitHub khol raha hoon Boss."
    );

    window.open(
      "https://github.com",
      "_blank"
    );

    return true;
  }


  return false;
}


// ======================================
// AI BRAIN
// ======================================

async function askJarvis(command) {

  if (!command || !command.trim()) {
    return;
  }


  // Local command
  if (handleCommand(command)) {

    status.innerText =
      "SYSTEM ONLINE";

    return;
  }


  status.innerText =
    "THINKING...";


  message.innerText =
    "JARVIS is thinking...";


  try {

    const response =
      await fetch(
        `${BACKEND_URL}/chat`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: command
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Server error"
      );
    }


    if (!data.reply) {

      throw new Error(
        "No reply received"
      );
    }


    speak(data.reply);


  } catch (error) {

    console.error(error);

    speak(
      "Sorry Boss, I am having trouble connecting to my AI brain."
    );
  }


  status.innerText =
    "SYSTEM ONLINE";
}


// ======================================
// TEXT INPUT
// ======================================

function sendText() {

  const input =
    document.getElementById(
      "textInput"
    );


  const command =
    input.value.trim();


  if (command) {

    input.value = "";

    askJarvis(command);
  }
}


// ======================================
// ENTER KEY
// ======================================

function handleEnter(event) {

  if (event.key === "Enter") {
    sendText();
  }
}


// ======================================
// VOICE RECOGNITION
// ======================================

function startListening() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    speak(
      "Sorry Boss, voice recognition is not supported in this browser."
    );

    return;
  }


  const recognition =
    new SpeechRecognition();


  // Hindi + English
  recognition.lang =
    "hi-IN";


  recognition.continuous =
    false;


  recognition.interimResults =
    false;


  status.innerText =
    "LISTENING...";


  try {

    recognition.start();

  } catch (error) {

    console.log(error);

  }


  recognition.onresult =
    function(event) {

      const command =
        event.results[0][0]
          .transcript;


      message.innerText =
        command;


      askJarvis(command);
    };


  recognition.onerror =
    function(event) {

      console.error(
        "Voice error:",
        event.error
      );


      status.innerText =
        "SYSTEM ONLINE";


      speak(
        "Sorry Boss, I could not understand that."
      );
    };


  recognition.onend =
    function() {

      if (
        status.innerText ===
        "LISTENING..."
      ) {

        status.innerText =
          "SYSTEM ONLINE";
      }
    };

}


// ======================================
// STARTUP
// ======================================

console.log(
  "JARVIS Natural Voice System Loaded."
);

</script>

</body>

</html>
